version: 2
updates:
  # One grouped PR per ecosystem per week, instead of one PR per package.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # The Node major is pinned on purpose (see .nvmrc); bump it by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
